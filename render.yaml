services:
  - type: web
    name: u4s7-garcia-vasquez-oscar
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn miproyecto.wsgi"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: u4s7-garcia-vasquez-oscar.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://u4s7-garcia-vasquez-oscar.onrender.com
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
